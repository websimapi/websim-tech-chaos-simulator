<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Chaos Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>When All Your Tech Goes Wrong At Once</h1>
        <div class="office-scene">
            <div class="devices">
                <div class="device computer" id="computer">
                    <svg viewBox="0 0 100 80" class="computer-svg">
                        <rect x="10" y="10" width="80" height="50" rx="2" fill="#333" />
                        <rect x="15" y="15" width="70" height="40" fill="#0078D7" id="screen" />
                        <text x="50" y="35" text-anchor="middle" fill="white" class="error-text">ERROR</text>
                        <rect x="25" y="60" width="50" height="5" fill="#555" />
                        <rect x="45" y="65" width="10" height="5" fill="#666" />
                        <rect x="20" y="70" width="60" height="3" fill="#888" />
                    </svg>
                </div>
                <div class="device phone" id="phone">
                    <svg viewBox="0 0 50 100" class="phone-svg">
                        <rect x="5" y="5" width="40" height="90" rx="5" fill="#222" />
                        <rect x="8" y="15" width="34" height="60" fill="#333" id="phone-screen" />
                        <circle cx="25" cy="85" r="5" fill="#444" />
                        <rect x="20" y="10" width="10" height="2" rx="1" fill="#444" />
                    </svg>
                </div>
                <div class="device printer" id="printer">
                    <svg viewBox="0 0 100 70" class="printer-svg">
                        <rect x="10" y="20" width="80" height="40" rx="2" fill="#444" />
                        <rect x="20" y="10" width="60" height="10" fill="#555" />
                        <rect x="20" y="60" width="60" height="5" fill="#555" class="paper-tray" />
                        <circle cx="80" cy="30" r="3" fill="#77FF77" class="printer-light" />
                        <circle cx="70" cy="30" r="3" fill="#FF7777" class="printer-error" />
                    </svg>
                </div>
                <div class="device router" id="router">
                    <svg viewBox="0 0 80 40" class="router-svg">
                        <rect x="5" y="5" width="70" height="30" rx="2" fill="#333" />
                        <circle cx="15" cy="15" r="3" fill="#77FF77" class="router-light" />
                        <circle cx="25" cy="15" r="3" fill="#77FF77" class="router-light" />
                        <circle cx="35" cy="15" r="3" fill="#77FF77" class="router-light" />
                        <rect x="10" y="25" width="60" height="2" fill="#555" />
                    </svg>
                </div>
                <div class="device coffee-machine" id="coffee-machine">
                    <svg viewBox="0 0 60 80" class="coffee-svg">
                        <rect x="10" y="10" width="40" height="60" rx="2" fill="#555" />
                        <rect x="15" y="15" width="30" height="10" fill="#333" />
                        <rect x="20" y="70" width="20" height="5" fill="#333" />
                        <circle cx="20" cy="35" r="3" fill="#FF7777" />
                        <rect x="25" y="30" width="15" height="10" rx="2" fill="#777" />
                        <rect x="30" y="40" width="5" height="20" fill="#444" class="coffee-stream" />
                        <path d="M25,60 Q30,65 35,60" fill="none" stroke="#444" stroke-width="2" />
                    </svg>
                </div>
            </div>
            <div class="character">
                <svg viewBox="0 0 100 150" class="character-svg">
                    <circle cx="50" cy="30" r="20" fill="#FFD8B1" />
                    <ellipse cx="50" cy="90" rx="20" ry="40" fill="#5588FF" />
                    <rect x="30" y="50" width="40" height="10" fill="#FFD8B1" />
                    <line x1="30" y1="60" x2="10" y2="80" stroke="#FFD8B1" stroke-width="8" stroke-linecap="round" class="arm left-arm" />
                    <line x1="70" y1="60" x2="90" y2="80" stroke="#FFD8B1" stroke-width="8" stroke-linecap="round" class="arm right-arm" />
                    <line x1="40" y1="130" x2="40" y2="150" stroke="#333" stroke-width="8" stroke-linecap="round" class="leg" />
                    <line x1="60" y1="130" x2="60" y2="150" stroke="#333" stroke-width="8" stroke-linecap="round" class="leg" />
                    <circle cx="43" cy="25" r="3" fill="#333" />
                    <circle cx="57" cy="25" r="3" fill="#333" />
                    <path d="M43,38 Q50,43 57,38" fill="none" stroke="#333" stroke-width="2" id="mouth" />
                </svg>
            </div>
        </div>
        <div class="controls">
            <button id="start-chaos">Start Tech Chaos</button>
            <button id="fix-all" disabled>Fix Everything</button>
        </div>
        <div class="status-box">
            <p id="status-message">All systems normal... for now.</p>
        </div>
    </div>

</body>
</html>
